name: Build ISO
on:
  workflow_dispatch:
    inputs:
      recipe:
        description: 'The recipe file to build the ISO for'
        required: true
        default: 'recipe.yml'
        type: string

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup BlueBuild
        uses: blue-build/setup-action@v3
        with:
          cli_version: v0.9.0

      - name: Generate ISO
        run: |
          bluebuild generate-iso recipes/${{ inputs.recipe }}

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: fetteno-os-iso
          path: "*.iso"
