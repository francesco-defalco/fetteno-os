name: fetteno-os
description: My Bluefin-DX development workstation for ThinkPad P14s
image-version: latest

base-image: ghcr.io/ublue-os/bluefin-dx

modules:
  # 1. UTILITIES DI BASE (Piccoli tool integrati nel sistema)
  - type: rpm-ostree
    install:
      - fzf
      - bat

  # 2. SERVIZIO BATTERIA (La logica hardware del ThinkPad)
  - type: systemd
    system:
      enabled:
        - thinkpad-battery-manager.service

  # 3. BROWSER E APP GRAFICHE (Gestiti in modo sicuro via Flatpak)
  - type: default-flatpaks
    notify: true
    system:
      repo-url: https://dl.flathub.org/repo/flathub.flatpakrepo
      repo-name: flathub
      repo-title: "Flathub"
      install:
        - com.google.Chrome
        - com.brave.Browser
        - com.mattjakeman.ExtensionManager

  # 4. FILE E CONFIGURAZIONI (Iniettiamo il tuo Zsh)
  - type: files
    files:
      - source: usr
        destination: /usr
      - source: etc
        destination: /etc
