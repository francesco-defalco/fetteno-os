name: fetteno-os
description: My Bluefin-DX development workstation for ThinkPad P14s
image-version: latest

base-image: ghcr.io/ublue-os/bluefin-dx

modules:
  # 1. CUSTOM FILES AND CONFIGURATIONS 
  - type: files
    files:
      - source: usr
        destination: /usr
      - source: etc
        destination: /etc

  # 2. UTILITIES
  - type: rpm-ostree
    install:
      - fzf
      - bat

  # 3. BATTERY SERVICE
  - type: systemd
    system:
      enabled:
        - thinkpad-battery-manager.service

  # 4. BROWSERS AND GUI APPS (v2 Syntax)
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.google.Chrome
          - com.brave.Browser
          - com.mattjakeman.ExtensionManager
