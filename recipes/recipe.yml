name: fetteno-os-gnome
description: My Bluefin-DX development workstation for ThinkPad P14s
image-version: latest

base-image: ghcr.io/ublue-os/aurora-dx

modules:
  # 1. CUSTOM FILES
  - type: files
    files:
      - source: usr
        destination: /usr

  # 2. CACHYOS & SCX REPOSITORIES (Origami/RakuOS DNA)
  # Inject the community repositories for the custom kernel and schedulers
  - type: copr
    coprs:
      - bieszczaders/kernel-cachyos
      - alternate-gentoo/scx

  # 3. KERNEL REPLACEMENT
  - type: rpm-ostree
    remove:
      - kernel
      - kernel-core
      - kernel-modules
      - kernel-modules-core
      - kernel-modules-extra
    install:
      - kernel-cachyos
      - kernel-cachyos-devel-matched

  # 4. SYSTEM PACKAGES
  - type: rpm-ostree
    install:
      - brightnessctl
      - ddcutil
      - kio-gdrive
      - kaccounts-integration
      - kaccounts-providers
      - signon-plugin-oauth2
      - signon-ui
      - bpftrace
      - bcc-tools
      - flameshot
      - gawk
      - inotify-tools
      - redshift
      - vdpauinfo
      - libva-utils
      - ffmpeg
      - gpaste
      - gpaste-ui
      - rsms-inter-fonts
      - google-roboto-fonts

  # 5. GNOME EXTENSIONS
  - type: gnome-extensions
    install:
      - 5090 # Space Bar
      - 3843 # Just Perfection

  # 6. FLATPAK APPLICATIONS
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.google.Chrome
          - com.brave.Browser
          - com.opera.Opera
          - com.visualstudio.code
          - org.videolan.VLC
          - com.protonvpn.www
          - md.obsidian.Obsidian
          - com.discordapp.Discord
          - com.mattjakeman.ExtensionManager

  # 7. SCRIPTS AND SERVICES
  - type: script
    snippets:
      - |
        chmod +x /usr/bin/fetteno-setup
        chmod +x /usr/bin/fetteno-brightness
        # [Inserisci qui il resto dei tuoi script...]

  - type: systemd
    system:
      enabled:
        - thinkpad-battery-manager.service
