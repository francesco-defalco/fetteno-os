name: fetteno-os
description: My Bluefin-DX development workstation for ThinkPad P14s
image-version: latest

base-image: ghcr.io/ublue-os/bluefin-dx

modules:
  # 1. CUSTOM FILES
  # This module must run first so the systemd service can find the battery script
  - type: files
    files:
      - source: usr
        destination: /usr
      - source: etc
        destination: /etc

  # 2. SYSTEM PACKAGES
  # Installing essential CLI tools and missing dependencies from Linux Mint
  - type: rpm-ostree
    install:
      - bpftrace
      - bcc-tools
      - brightnessctl
      - ddcutil
      - flameshot
      - gawk
      - inotify-tools
      - preload
      - redshift
      - refind
      - vdpauinfo
      - libva-utils
      - ffmpeg
      - gpaste
      - gpaste-ui
      - rsms-inter-fonts
      - google-roboto-fonts

  # 3. CUSTOM SCRIPTS
  # Execute bash scripts to install third-party repos (e.g., Microsoft Fonts)
  - type: script
    scripts:
      - install-ms-fonts.sh

  # 4. THINKPAD BATTERY SERVICE
  # Enable the custom systemd service on boot
  - type: systemd
    system:
      enabled:
        - thinkpad-battery-manager.service

  # 5. FLATPAK APPLICATIONS
  # Browsers, IDEs, and GUI apps installed securely in user space (v2 Syntax)
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.google.Chrome
          - com.brave.Browser
          - com.opera.Opera
          - com.visualstudio.code
          - org.videolan.VLC
          - com.protonvpn.www
          - com.mattjakeman.ExtensionManager
