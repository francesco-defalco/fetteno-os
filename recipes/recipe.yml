name: fetteno-os
description: My pure Bluefin-DX workstation for ThinkPad P14s with custom scripts
image-version: latest

# Base image: Official Bluefin developer image (GNOME)
base-image: ghcr.io/ublue-os/bluefin-dx

modules:
  # 1. CUSTOM FILES
  # Inject custom scripts and system overrides into /usr
  - type: files
    files:
      - source: usr
        destination: /usr

  # 2. SCRIPTS & PERMISSIONS
  # Make the custom setup script executable
  - type: script
    snippets:
      - |
        chmod +x /usr/bin/fetteno-setup
