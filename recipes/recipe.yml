name: fetteno-os
description: My Bluefin-DX development workstation for ThinkPad P14s
image-version: latest

base-image: ghcr.io/ublue-os/bluefin-dx

modules:
  # 1. CUSTOM FILES AND CONFIGURATIONS 
  # (MUST go first so the systemd module can find the battery script later)
  - type: files
    files:
      - source: usr
        destination: /usr
      - source: etc
        destination: /etc

  # 2. UTILITIES (Small core system tools)
  - type: rpm-ostree
    install:
      - fzf
      - bat

  # 3. BATTERY SERVICE (Now the file exists, it can be enabled successfully!)
  - type: systemd
    system:
      enabled:
        - thinkpad-battery-manager.service

  # 4. BROWSERS AND GUI APPS (Safely managed via Flatpak - v2 Syntax)
  - type: default-flatpaks
    system:
      install:
        - com.google.Chrome
        - com.brave.Browser
        - com.mattjakeman.ExtensionManager
