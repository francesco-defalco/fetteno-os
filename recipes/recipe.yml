name: fetteno-os
description: My pure Aurora-DX workstation for ThinkPad P14s with custom scripts
image-version: latest

# Base image: Official Aurora developer image
base-image: ghcr.io/ublue-os/aurora-dx

modules:
  # 1. CUSTOM FILES
  # Inject custom scripts and system overrides into /usr
  - type: files
    files:
      - source: usr
        destination: /usr

  # 2. SYSTEM PACKAGES
  # Install hardware control packages and required modules for Google Drive integration
  - type: rpm-ostree
    install:
      - brightnessctl
      - ddcutil
      - kio-gdrive
      - kaccounts-integration
      - kaccounts-providers
      - signon-plugin-oauth2
      - signon-ui
      
  # 3. SCRIPTS, PERMISSIONS & SYSTEM DEFAULTS
  # Apply execution permissions, Zsh keybindings, defaults, OS debloat, and Wayland fixes
  - type: script
    snippets:
      - |
        # Grant execution permissions to custom system scripts
        chmod +x /usr/bin/fetteno-setup
        chmod +x /usr/bin/fetteno-brightness
        
        # --- Zsh Keybindings ---
        echo "Applying Zsh keyboard shortcuts for Fetteno-OS..."
        cat << 'EOF' >> /etc/zshrc

        # --- Fetteno-OS keyboard shortcuts ---
        bindkey '^[[1;5D' backward-word
        bindkey '^[[1;5C' forward-word
        bindkey '^[[3;5~' kill-word
        bindkey '^H' backward-kill-word
        EOF

        # --- KDE Plasma Global Shortcuts for Brightness ---
        echo "Creating background desktop services for Fetteno Brightness..."
        
        cat << 'EOF' > /usr/share/applications/fetteno-brightness-up.desktop
        [Desktop Entry]
        Type=Application
        Name=Fetteno Brightness Up
        Exec=/usr/bin/fetteno-brightness up
        Terminal=false
        NoDisplay=true
        EOF
        
        cat << 'EOF' > /usr/share/applications/fetteno-brightness-down.desktop
        [Desktop Entry]
        Type=Application
        Name=Fetteno Brightness Down
        Exec=/usr/bin/fetteno-brightness down
        Terminal=false
        NoDisplay=true
        EOF
        
        echo "Registering default KDE global shortcuts (Ctrl+F5 / Ctrl+F6)..."
        mkdir -p /etc/xdg
        cat << 'EOF' >> /etc/xdg/kglobalshortcutsrc
        
        [fetteno-brightness-up.desktop]
        _k_friendly_name=Fetteno Brightness Up
        _launch=Ctrl+F6,none,Fetteno Brightness Up
        
        [fetteno-brightness-down.desktop]
        _k_friendly_name=Fetteno Brightness Down
        _launch=Ctrl+F5,none,Fetteno Brightness Down
        EOF

        # --- Auto Font Switcher Daemon ---
        echo "Creating Fetteno Auto Font daemon..."
        cat << 'EOF' > /usr/bin/fetteno-autofont
        #!/bin/bash
        # Font auto-switcher for Fetteno-OS
        
        LAST_STATE=""
        
        update_fonts() {
            MONITORS=$(cat /sys/class/drm/*/status 2>/dev/null | grep -c "^connected")
            
            if [ "$MONITORS" -gt 1 ]; then
                STATE="external"
                FONT_SIZE=10
            else
                STATE="laptop"
                FONT_SIZE=12
            fi
            
            if [ "$STATE" != "$LAST_STATE" ]; then
                kwriteconfig6 --file k
