name: fetteno-os
description: My Bluefin-DX development workstation for ThinkPad P14s
image-version: latest

base-image: ghcr.io/ublue-os/bluefin-dx

modules:
  # Custom files (must precede systemd module)
  - type: files
    files:
      - source: usr
        destination: /usr
      - source: etc
        destination: /etc

  # System packages and extra repositories
  - type: rpm-ostree
    copr:
      - dawid/mscorefonts
    install:
      - bpftrace
      - bcc-tools
      - brightnessctl
      - ddcutil
      - flameshot
      - gawk
      - inotify-tools
      - preload
      - redshift
      - refind
      - vdpauinfo
      - libva-utils
      - ffmpeg
      - gpaste
      - gpaste-ui
      - rsms-inter-fonts
      - google-roboto-fonts
      - mscore-fonts

  # ThinkPad battery threshold service
  - type: systemd
    system:
      enabled:
        - thinkpad-battery-manager.service

  # GUI applications and browsers
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.google.Chrome
          - com.brave.Browser
          - com.opera.Opera
          - com.visualstudio.code
          - org.videolan.VLC
          - com.protonvpn.www
          - com.mattjakeman.ExtensionManager
