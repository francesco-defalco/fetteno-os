name: fetteno-os
description: My Bluefin-DX development workstation for ThinkPad P14s
image-version: latest

base-image: ghcr.io/ublue-os/bluefin-dx

modules:
  # 1. CUSTOM FILES
  - type: files
    files:
      - source: usr
        destination: /usr
      - source: etc
        destination: /etc

  # 2. SYSTEM PACKAGES
  - type: rpm-ostree
    install:
      - bpftrace
      - bcc-tools
      - brightnessctl
      - ddcutil
      - flameshot
      - gawk
      - inotify-tools
      - redshift
      - vdpauinfo
      - libva-utils
      - ffmpeg
      - gpaste
      - gpaste-ui
      - rsms-inter-fonts
      - google-roboto-fonts

  # 3. THINKPAD BATTERY SERVICE
  - type: systemd
    system:
      enabled:
        - thinkpad-battery-manager.service

  # 4. FLATPAK APPLICATIONS
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.google.Chrome
          - com.brave.Browser
          - com.opera.Opera
          - com.visualstudio.code
          - org.videolan.VLC
          - com.protonvpn.www
          - com.mattjakeman.ExtensionManager
