name: fetteno-os
description: My Bluefin-DX development workstation for ThinkPad P14s
image-version: latest

# Using the official GNOME Developer Experience image
base-image: ghcr.io/ublue-os/cosmic-atomic-main
modules:
  # 1. CUSTOM FILES
  # Injects custom scripts, systemd services, and GNOME schema overrides
  - type: files
    files:
      - source: usr
        destination: /usr

  # 2. SYSTEM PACKAGES
  # Installs native Fedora packages required for system utilities
  # Note: Zsh and Starship are already included and optimized by Bluefin-DX
  - type: rpm-ostree
    install:
      - bpftrace
      - bcc-tools
      - brightnessctl
      - ddcutil
      - flameshot
      - gawk
      - inotify-tools
      - redshift
      - vdpauinfo
      - libva-utils
      - ffmpeg
      - gpaste
      - gpaste-ui
      - rsms-inter-fonts
      - google-roboto-fonts

  # 3. SET EXECUTABLE PERMISSIONS
  # Ensures the post-installation setup script can be executed by the user
  - type: script
    snippets:
      - |
        chmod +x /usr/bin/fetteno-setup

  # 4. THINKPAD BATTERY SERVICE
  # Enables the battery threshold manager on system boot
  - type: systemd
    system:
      enabled:
        - thinkpad-battery-manager.service

  # 5. GNOME EXTENSIONS
  # Only using highly maintained extensions to replicate the COSMIC layout
  - type: gnome-extensions
    install:
      - 5090 # Space Bar: Replaces "Activities" with workspace numbers
      - 3843 # Just Perfection: Hides legacy UI elements

  # 6. FLATPAK APPLICATIONS
  # Installs GUI applications directly into the system scope
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.google.Chrome
          - com.brave.Browser
          - com.opera.Opera
          - com.visualstudio.code
          - org.videolan.VLC
          - com.protonvpn.www
          - com.mattjakeman.ExtensionManager
